<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <filter id="glow-amber" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes wavePulse {
      0%, 100% { transform: scaleY(1); opacity: 0.7; }
      50% { transform: scaleY(1.3); opacity: 1; }
    }
    .seismic-wave {
      transform-origin: 200px 300px;
      animation: wavePulse 3s ease-in-out infinite;
    }
  </style>

  <rect width="400" height="600" fill="#0a0b14" />

  <!-- Seismic Telemetry Graph -->
  <g class="seismic-wave" stroke="#f59e0b" stroke-width="2" fill="none" filter="url(#glow-amber)">
    <path d="M 20 300 L 100 300 L 120 220 L 140 380 L 160 180 L 180 420 L 200 120 L 220 480 L 240 240 L 260 360 L 280 300 L 380 300" />
  </g>

  <!-- Hexagonal Grid Overlay -->
  <polygon points="200,180 250,210 250,270 200,300 150,270 150,210" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />
  <polygon points="200,300 250,330 250,390 200,420 150,390 150,330" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />

  <rect x="10" y="10" width="380" height="580" fill="none" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.3" rx="8" />
</svg>
