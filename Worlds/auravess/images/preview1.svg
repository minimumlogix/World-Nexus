<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <filter id="glow-gold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-purple" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="imperial-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#c5a059" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
    <linearGradient id="royal-violet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b0764" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <style>
    @keyframes astrolabeRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes reverseRotate {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes pulseCrest {
      0%, 100% { transform: scale(0.96); filter: drop-shadow(0 0 8px rgba(197,160,89,0.4)); }
      50% { transform: scale(1.04); filter: drop-shadow(0 0 20px rgba(168,85,247,0.8)); }
    }
    @keyframes floatSparkles {
      0% { transform: translateY(0px); opacity: 0.2; }
      50% { transform: translateY(-20px); opacity: 0.9; }
      100% { transform: translateY(-40px); opacity: 0.2; }
    }
    .astrolabe-outer {
      transform-origin: 200px 300px;
      animation: astrolabeRotate 30s linear infinite;
    }
    .astrolabe-inner {
      transform-origin: 200px 300px;
      animation: reverseRotate 20s linear infinite;
    }
    .crest-core {
      transform-origin: 200px 300px;
      animation: pulseCrest 4s ease-in-out infinite;
    }
    .sparkle {
      animation: floatSparkles 3s ease-in-out infinite;
    }
  </style>

  <!-- Dark Imperial Background Canvas -->
  <rect width="400" height="600" fill="#090514" />
  
  <!-- Ambient Imperial Glow -->
  <circle cx="200" cy="300" r="180" fill="url(#royal-violet)" filter="url(#glow-purple)" />

  <!-- Outer Celestial Astrolabe Ring -->
  <g class="astrolabe-outer" stroke="url(#imperial-gold)" stroke-width="1.5" fill="none" opacity="0.6">
    <circle cx="200" cy="300" r="140" stroke-dasharray="4 8 12 8" />
    <circle cx="200" cy="300" r="120" stroke-opacity="0.4" />
    <polygon points="200,160 210,180 190,180" fill="url(#imperial-gold)" />
    <polygon points="200,440 210,420 190,420" fill="url(#imperial-gold)" />
    <polygon points="60,300 80,310 80,290" fill="url(#imperial-gold)" />
    <polygon points="340,300 320,310 320,290" fill="url(#imperial-gold)" />
  </g>

  <!-- Inner Rotating Runed Astrolabe Ring -->
  <g class="astrolabe-inner" stroke="#a855f7" stroke-width="1.2" fill="none" opacity="0.75" filter="url(#glow-purple)">
    <circle cx="200" cy="300" r="95" stroke-dasharray="16 6 4 6" />
    <polygon points="200,205 205,215 195,215" fill="#a855f7" />
    <polygon points="200,395 205,385 195,385" fill="#a855f7" />
  </g>

  <!-- Imperial Crest Center Motif -->
  <g class="crest-core">
    <!-- Crown Emblem -->
    <path d="M 160 270 L 175 250 L 200 280 L 225 250 L 240 270 L 230 310 L 170 310 Z" fill="url(#imperial-gold)" filter="url(#glow-gold)" />
    <!-- Assassin Dagger Accent -->
    <path d="M 200 220 L 206 280 L 200 340 L 194 280 Z" fill="#ffffff" opacity="0.9" filter="url(#glow-gold)" />
    <!-- Diamond Gem Core -->
    <polygon points="200,285 212,300 200,315 188,300" fill="#a855f7" />
  </g>

  <!-- Floating Imperial Particles -->
  <circle cx="120" cy="220" r="2.5" fill="#fef08a" class="sparkle" style="animation-delay: 0s;" />
  <circle cx="280" cy="240" r="3" fill="#a855f7" class="sparkle" style="animation-delay: 0.8s;" />
  <circle cx="150" cy="380" r="2" fill="#c5a059" class="sparkle" style="animation-delay: 1.4s;" />
  <circle cx="260" cy="360" r="2.5" fill="#fef08a" class="sparkle" style="animation-delay: 2.1s;" />

  <!-- Frame Border -->
  <rect x="10" y="10" width="380" height="580" fill="none" stroke="url(#imperial-gold)" stroke-width="1" stroke-opacity="0.3" rx="8" />
</svg>
