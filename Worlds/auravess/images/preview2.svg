<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <filter id="glow-gold2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="gold-shimmer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
  </defs>

  <style>
    @keyframes curtainWave {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-8px) scale(1.02); }
    }
    @keyframes spellRuneRotate {
      0% { transform: rotate(0deg); opacity: 0.4; }
      50% { opacity: 0.8; }
      100% { transform: rotate(-360deg); opacity: 0.4; }
    }
    .curtain-motif {
      transform-origin: 200px 300px;
      animation: curtainWave 5s ease-in-out infinite;
    }
    .rune-ring {
      transform-origin: 200px 300px;
      animation: spellRuneRotate 25s linear infinite;
    }
  </style>

  <rect width="400" height="600" fill="#0c071a" />

  <!-- Veiled Imperial Backdrop -->
  <g class="curtain-motif">
    <path d="M 0 0 Q 100 120 200 60 Q 300 120 400 0 L 400 600 L 0 600 Z" fill="#1e1035" opacity="0.6" />
    <path d="M 0 100 Q 100 220 200 160 Q 300 220 400 100" fill="none" stroke="url(#gold-shimmer)" stroke-width="1.5" stroke-opacity="0.4" />
  </g>

  <!-- Spell Rune Ring -->
  <g class="rune-ring" stroke="#c5a059" stroke-width="1.5" fill="none" filter="url(#glow-gold2)">
    <circle cx="200" cy="300" r="110" stroke-dasharray="12 8 4 8" />
    <polygon points="200,190 208,205 192,205" fill="#fef08a" />
    <polygon points="200,410 208,395 192,395" fill="#fef08a" />
    <polygon points="90,300 105,308 105,292" fill="#fef08a" />
    <polygon points="310,300 295,308 295,292" fill="#fef08a" />
  </g>

  <!-- Imperial Crest Shield Emblem -->
  <g transform="translate(150, 230)">
    <path d="M 50 0 L 100 25 L 100 80 Q 50 140 50 140 Q 50 140 0 80 L 0 25 Z" fill="url(#gold-shimmer)" opacity="0.85" filter="url(#glow-gold2)" />
    <path d="M 50 20 L 80 38 L 80 75 Q 50 115 50 115 Q 50 115 20 75 L 20 38 Z" fill="#0c071a" />
    <circle cx="50" cy="65" r="15" fill="#a855f7" />
  </g>

  <!-- Border -->
  <rect x="10" y="10" width="380" height="580" fill="none" stroke="#c5a059" stroke-width="1" stroke-opacity="0.3" rx="8" />
</svg>
