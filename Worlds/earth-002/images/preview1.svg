<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <filter id="glow-emerald" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="earth-grid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <style>
    @keyframes globeSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pingPulse {
      0% { r: 5px; opacity: 0.9; }
      100% { r: 50px; opacity: 0; }
    }
    .globe-ring {
      transform-origin: 200px 300px;
      animation: globeSpin 35s linear infinite;
    }
    .ping-ring {
      animation: pingPulse 2.5s infinite ease-out;
    }
  </style>

  <rect width="400" height="600" fill="#041217" />

  <!-- Global Satellite Orbit Wireframe Globe -->
  <g class="globe-ring" stroke="url(#earth-grid)" stroke-width="1.5" fill="none" opacity="0.8" filter="url(#glow-emerald)">
    <circle cx="200" cy="300" r="140" stroke-dasharray="8 6" />
    <ellipse cx="200" cy="300" rx="140" ry="50" />
    <ellipse cx="200" cy="300" rx="140" ry="90" />
    <ellipse cx="200" cy="300" rx="50" ry="140" />
    <ellipse cx="200" cy="300" rx="90" ry="140" />
  </g>

  <!-- GPS Node Ping Signals -->
  <circle cx="200" cy="300" r="12" fill="#10b981" filter="url(#glow-emerald)" />
  <circle cx="200" cy="300" r="5" fill="#ffffff" />
  <circle cx="200" cy="300" r="25" fill="none" stroke="#10b981" stroke-width="2" class="ping-ring" />
  <circle cx="200" cy="300" r="40" fill="none" stroke="#0284c7" stroke-width="1.5" class="ping-ring" style="animation-delay: 1.2s;" />

  <!-- Orbital Satellites -->
  <circle cx="120" cy="200" r="4" fill="#38bdf8" />
  <line x1="120" y1="200" x2="200" y2="300" stroke="#0284c7" stroke-width="1" stroke-dasharray="3 3" opacity="0.5" />
  
  <circle cx="290" cy="380" r="4" fill="#38bdf8" />
  <line x1="290" y1="380" x2="200" y2="300" stroke="#0284c7" stroke-width="1" stroke-dasharray="3 3" opacity="0.5" />

  <!-- Border -->
  <rect x="10" y="10" width="380" height="580" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.3" rx="8" />
</svg>
