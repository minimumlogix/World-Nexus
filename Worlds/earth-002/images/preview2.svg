<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <filter id="glow-city" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes waveScan {
      0% { transform: translateY(0); opacity: 0.3; }
      50% { transform: translateY(580px); opacity: 0.8; }
      100% { transform: translateY(0); opacity: 0.3; }
    }
    .scanner-line {
      animation: waveScan 4s ease-in-out infinite;
    }
  </style>

  <rect width="400" height="600" fill="#020d1a" />

  <!-- Digital City Horizon Silhouette -->
  <path d="M 0 450 L 40 450 L 40 380 L 70 380 L 70 450 L 110 450 L 110 320 L 150 320 L 150 450 L 190 450 L 190 280 L 230 280 L 230 450 L 280 450 L 280 360 L 330 360 L 330 450 L 400 450 L 400 600 L 0 600 Z" fill="#061f38" opacity="0.9" />

  <!-- Telemetry Waveforms -->
  <path d="M 20 200 Q 80 150 140 220 T 260 180 T 380 240" fill="none" stroke="#0284c7" stroke-width="2" filter="url(#glow-city)" />
  <path d="M 20 230 Q 80 280 140 210 T 260 250 T 380 210" fill="none" stroke="#10b981" stroke-width="2" opacity="0.8" filter="url(#glow-city)" />

  <!-- Scanning Sweep Line -->
  <line x1="0" y1="10" x2="400" y2="10" stroke="#10b981" stroke-width="2" class="scanner-line" filter="url(#glow-city)" />

  <rect x="10" y="10" width="380" height="580" fill="none" stroke="#0284c7" stroke-width="1" stroke-opacity="0.3" rx="8" />
</svg>
