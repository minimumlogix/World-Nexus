<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes cardFloat1 {
      0%, 100% { transform: translateY(0px) rotate(-6deg); }
      50% { transform: translateY(-16px) rotate(4deg); }
    }
    .floating-card {
      transform-origin: 200px 300px;
      animation: cardFloat1 4.5s ease-in-out infinite;
    }
  </style>

  <rect width="400" height="600" fill="#05101a" />

  <!-- Zero-Logic Floating Geometry Motif -->
  <g class="floating-card" filter="url(#glow-cyan)">
    <rect x="130" y="210" width="140" height="180" fill="none" stroke="#06b6d4" stroke-width="2" rx="10" />
    <circle cx="200" cy="300" r="40" fill="#ec4899" opacity="0.8" />
    <path d="M 170 300 L 230 300 M 200 270 L 200 330" stroke="#ffffff" stroke-width="3" />
  </g>

  <!-- Frame -->
  <rect x="10" y="10" width="380" height="580" fill="none" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.3" rx="8" />
</svg>
