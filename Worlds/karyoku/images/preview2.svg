<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <filter id="glow-shuriken" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes shurikenSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .ninja-shuriken {
      transform-origin: 200px 300px;
      animation: shurikenSpin 10s linear infinite;
    }
  </style>

  <rect width="400" height="600" fill="#09050d" />

  <!-- Full Moon Background -->
  <circle cx="200" cy="300" r="120" fill="#fef3c7" opacity="0.15" />

  <!-- Rotating 4-Point Ninja Shuriken Motif -->
  <g class="ninja-shuriken" fill="#dc2626" filter="url(#glow-shuriken)">
    <polygon points="200,180 215,285 320,300 215,315 200,420 185,315 80,300 185,285" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="200" cy="300" r="18" fill="#09050d" />
  </g>

  <!-- Frame -->
  <rect x="10" y="10" width="380" height="580" fill="none" stroke="#f97316" stroke-width="1" stroke-opacity="0.3" rx="8" />
</svg>
