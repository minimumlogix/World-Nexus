<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <filter id="glow-red" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="blood-sun" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
  </defs>

  <style>
    @keyframes katanaSlash {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 4px rgba(220,38,38,0.4)); }
      50% { transform: scale(1.05); filter: drop-shadow(0 0 16px rgba(239,68,68,0.9)); }
    }
    @keyframes sakuraPetal {
      0% { transform: translate(0, 0) rotate(0deg); opacity: 0.9; }
      100% { transform: translate(120px, 500px) rotate(360deg); opacity: 0; }
    }
    .slashed-sun {
      transform-origin: 200px 300px;
      animation: katanaSlash 4s ease-in-out infinite;
    }
    .petal {
      animation: sakuraPetal 7s linear infinite;
    }
  </style>

  <rect width="400" height="600" fill="#0d0408" />

  <!-- Crimson Blood Sun Motif -->
  <g class="slashed-sun">
    <circle cx="200" cy="300" r="110" fill="url(#blood-sun)" opacity="0.85" filter="url(#glow-red)" />
    
    <!-- Crossed Katana Blades -->
    <line x1="90" y1="190" x2="310" y2="410" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
    <line x1="310" y1="190" x2="90" y2="410" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />

    <!-- Tsuba Katana Guards -->
    <circle cx="140" cy="240" r="10" fill="#f59e0b" stroke="#000000" stroke-width="2" />
    <circle cx="260" cy="240" r="10" fill="#f59e0b" stroke="#000000" stroke-width="2" />
  </g>

  <!-- Floating Sakura Cherry Blossom Petals -->
  <path d="M 80 80 Q 90 60 100 80 Q 90 100 80 80 Z" fill="#f472b6" class="petal" style="animation-delay: 0s;" />
  <path d="M 180 40 Q 190 20 200 40 Q 190 60 180 40 Z" fill="#f472b6" class="petal" style="animation-delay: 2s;" />
  <path d="M 40 160 Q 50 140 60 160 Q 50 180 40 160 Z" fill="#f472b6" class="petal" style="animation-delay: 4.5s;" />

  <!-- Frame -->
  <rect x="10" y="10" width="380" height="580" fill="none" stroke="#dc2626" stroke-width="1" stroke-opacity="0.3" rx="8" />
</svg>
